<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SalesTone AI - 営業ロープレアプリ</title>
    <style>
        :root {
            --primary: #5c7cfa;
            --primary-hover: #4c6ef5;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #343a40;
            --border: #e9ecef;
            --ai-bg: #edf2ff;
            --user-bg: #fff4e6;
        }
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            max-width: 600px;
            width: 100%;
            display: flex;
            flex-direction: column;
            max-height: 90vh;
        }
        h1 { font-size: 24px; text-align: center; margin-bottom: 5px; }
        p.subtitle { color: #868e96; font-size: 14px; text-align: center; margin-bottom: 20px; }
        
        .chat-area {
            flex-grow: 1;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-height: 400px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 15px;
            font-size: 15px;
            line-height: 1.5;
        }
        .message.ai {
            background-color: var(--ai-bg);
            align-self: flex-start;
            border-bottom-left-radius: 0;
        }
        .message.user {
            background-color: var(--user-bg);
            align-self: flex-end;
            border-bottom-right-radius: 0;
        }
        .message.system {
            background-color: #ffe3e3;
            align-self: center;
            font-size: 13px;
            border-radius: 10px;
            max-width: 90%;
            color: #c92a2a;
        }

        .controls { display: flex; justify-content: center; gap: 15px; }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        #micBtn { background-color: #ff6b6b; color: white; width: 200px; }
        #micBtn.listening { background-color: #c92a2a; animation: pulse 1.5s infinite; }
        #micBtn:disabled { background-color: #ced4da; cursor: not-allowed; animation: none; }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 107, 107, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(255, 107, 107, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 107, 107, 0); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>SalesTone AI</h1>
    <p class="subtitle">AI役員との音声ロープレ＆フィードバック</p>

    <div class="chat-area" id="chatArea">
        <div class="message ai">（マイクボタンを押して、挨拶から営業をスタートしてください）</div>
    </div>

    <div class="controls">
        <button id="micBtn">🎤 マイクで話す</button>
    </div>
</div>

<script>
    const chatArea = document.getElementById('chatArea');
    const micBtn = document.getElementById('micBtn');

    // === 【重要】ここに新しく取得した「AIza...」から始まるAPIキーを貼り付けてください ===
    const API_KEY = 'ここに新しいAPIキーを貼り付けてください';
    // ==============================================================================

    let chatHistory = [];
    let isRoleplaying = true;

    const systemPrompt = `
あなたは大手企業の決済権を持つ役員です。私はあなたに単価10万円〜100万円の商材を提案する営業担当です。
今から音声による商談のロールプレイングを行います。

【あなたの役割と性格】
- 大手企業の役員。忙しく、最初は少し警戒心が強いです。
- 営業担当の発言に対し、短く自然な会話（1〜3文程度）で返答してください。
- 商談中、以下のような「鋭く、いやらしい質問」を適度に投げかけてください。
  例：「それって他社と何が違うの？」「費用対効果は本当に出るの？」「今のままで十分回ってるけど？」
- すぐには納得しません。営業担当があなたの「現状の課題」や「放置した際のリスク」をうまく引き出せるか試してください。

【終了条件と総括コメント】
ユーザーがクロージング（契約の打診や、次回の約束）を明確に行ってきた場合、または会話が10往復程度に達した場合、商談を終了してください。
商談終了時、あなたは役員役を降りて、プロの営業コーチとしてフィードバックを行ってください。

【総括コメントの作成基準（トップセールスの極意）】
1. 営業は「モノ売り」ではなく「顧客の問題解決」になっているか。
2. 自分がプレゼンしすぎるのではなく、拡大質問（オープンクエスチョン）で「現状」「課題」「問題を放置した際のリスク・影響」を引き出せていたか。
3. クロージングにおいて、相手の不安をテストクロージングで引き出し、納得へと導けていたか。

必ず最後に「【総括コメント】」という見出しをつけ、良かった点と改善点を具体的にフィードバックして会話を完全に終了させてください。
`;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'ja-JP';
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onstart = () => {
            micBtn.classList.add('listening');
            micBtn.innerText = '🗣️ 聞いています...';
        };

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            handleUserSpeech(transcript);
        };

        recognition.onspeechend = () => {
            stopListening();
        };

        recognition.onerror = (event) => {
            console.error('Speech recognition error:', event.error);
            stopListening();
            addMessage('system', '音声認識エラー: ' + event.error);
        };
    } else {
        alert('お使いのブラウザは音声認識に対応していません。');
    }

    micBtn.addEventListener('click', () => {
        if (!isRoleplaying) {
            alert('ロープレは終了しました。ページをリロードしてください。');
            return;
        }
        if (recognition) recognition.start();
    });

    function stopListening() {
        if (recognition) recognition.stop();
        if (isRoleplaying && micBtn.innerText !== '⏳ AIが考え中...') {
            micBtn.classList.remove('listening');
            micBtn.innerText = '🎤 マイクで話す';
        }
    }

    function addMessage(role, text) {
        const div = document.createElement('div');
        div.className = `message ${role}`;
        div.innerHTML = text.replace(/\n/g, '<br>');
        chatArea.appendChild(div);
        chatArea.scrollTop = chatArea.scrollHeight;
        return div;
    }

    async function handleUserSpeech(text) {
        addMessage('user', text);
        chatHistory.push({ role: "user", parts: [{ text: text }] });
        
        micBtn.disabled = true;
        micBtn.classList.remove('listening');
        micBtn.innerText = '⏳ AIが考え中...';

        try {
            await callGeminiAPI();
        } catch (error) {
            // エラー時もここで確実に処理し、フリーズを防ぐ
            console.error(error);
            addMessage('system', '通信エラー: ' + error.message);
        } finally {
            // 成功しても失敗しても、最後に必ずボタンを元に戻す処理（フリーズ対策）
            if (isRoleplaying) {
                micBtn.disabled = false;
                micBtn.innerText = '🎤 マイクで話す';
            }
        }
    }

    async function callGeminiAPI() {
        // モデルは最新で安定している gemini-2.0-flash に設定
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`;

        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                system_instruction: { parts: { text: systemPrompt } },
                contents: chatHistory
            })
        });

        const data = await response.json();
        
        // APIキー間違いやエラーが返ってきた場合の処理
        if (!response.ok || data.error) {
            const errorMsg = data.error ? data.error.message : `HTTPエラー: ${response.status}`;
            throw new Error(`APIエラー (${errorMsg})。APIキーが正しいか確認してください。`);
        }

        // AIの回答がブロックされたり空だったりした場合の処理
        if (!data.candidates || data.candidates.length === 0 || !data.candidates[0].content) {
            throw new Error('AIからの応答が空でした。内容がセキュリティにブロックされた可能性があります。');
        }

        const aiText = data.candidates[0].content.parts[0].text;
        chatHistory.push({ role: "model", parts: [{ text: aiText }] });
        
        addMessage('ai', aiText);
        speak(aiText);

        if (aiText.includes("【総括コメント】")) {
            isRoleplaying = false;
            micBtn.disabled = true;
            micBtn.innerText = '🏁 ロープレ終了';
            addMessage('system', 'ロールプレイングが終了しました。ページを再読み込みすると初めからやり直せます。');
        }
    }

    function speak(text) {
        if ('speechSynthesis' in window) {
            const cleanText = text.replace(/【総括コメント】|[*#]/g, '');
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'ja-JP';
            utterance.rate = 1.1;  
            utterance.pitch = 0.9; 
            window.speechSynthesis.speak(utterance);
        }
    }
</script>

</body>
</html>
